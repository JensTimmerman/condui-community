<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <style>
      .cls-1 {
        fill: none;
        stroke: #000;
        stroke-width: 2px;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .cls-2 {
        fill: #000;
        stroke: #000;
        stroke-width: 1px;
        stroke-linejoin: round;
      }
    </style>
  </defs>
  <!-- Full-height vertical beam; inward triangles sit outside the square -->
  <line class="cls-1" x1="24" y1="6" x2="24" y2="42"/>
  <polygon class="cls-2" points="24,11 20.5,5.5 27.5,5.5"/>
  <polygon class="cls-2" points="24,37 20.5,42.5 27.5,42.5"/>
</svg>
